[project]
name = "eth-tracestat"
version = "0.1.0"
description = "Ethereum storage slot & account access pattern analyzer from block traces"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "tqdm>=4.65",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
app = ["marimo>=0.10"]

[project.scripts]
eth-tracestat = "eth_tracestat.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
